<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf7f2">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Álbum">
<title>Álbum do Casamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
/* Paleta e fonte: edite aqui */
:root{--bg:#faf7f2;--ink:#2b2a28;--mut:#6b665e;--p:#4f6b52;--s:#9c5564;--line:#e6dfd3;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:960px;margin:0 auto;padding:20px 16px 48px}
h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.1;margin:.2em 0}
h1{font-size:clamp(2.4rem,9vw,3.8rem)}
a{color:var(--s)}.muted{color:var(--mut)}.center{text-align:center}
:focus-visible{outline:3px solid var(--s);outline-offset:3px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.vh:focus-visible+label{outline:3px solid var(--s);outline-offset:3px}
.hero{text-align:center;padding:48px 0 28px}.hero p{margin:.3em 0;color:var(--mut)}
.btn{display:inline-block;border:0;border-radius:999px;background:var(--p);color:#fff;padding:14px 26px;font:600 1rem system-ui,sans-serif;cursor:pointer;text-align:center;transition:transform .15s,box-shadow .15s}
.btn:hover{box-shadow:0 6px 18px #4f6b5244}.btn:active{transform:scale(.97)}
.btn.big{display:block;padding:30px;font-size:1.35rem;margin:12px 0}
.btn.ghost{background:transparent;color:var(--p);border:1.5px solid var(--p)}
.btn.sm{padding:8px 14px;font-size:.9rem}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:24px;max-width:420px;margin:60px auto}
input[type=text],input[type=password]{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin:6px 0 16px}
#queue{list-style:none;padding:0}#queue li{display:grid;grid-template-columns:1fr 90px;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
#queue progress{width:100%;height:8px;accent-color:var(--p)}#queue em{grid-column:1/3;font-style:normal;color:var(--mut)}#queue .err em{color:#b3261e}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;margin-left:4px;cursor:pointer;font:inherit}
.tabs [aria-selected=true]{background:var(--p);color:#fff;border-color:var(--p)}
.masonry{column-width:160px;column-gap:10px}
.masonry figure,.mcard{margin:0 0 10px;break-inside:avoid;position:relative;border-radius:10px;overflow:hidden;background:#eee}
.masonry img,.masonry video{width:100%;display:block}.masonry img{cursor:zoom-in}
.ph{position:relative}figcaption{padding:6px 10px;font-size:.85rem;color:var(--mut);background:#fff}.ph[data-wm]::after{content:attr(data-wm);position:absolute;right:8px;bottom:6px;color:#fffe;font:600 .85rem "Cormorant Garamond",serif;text-shadow:0 1px 3px #0009;pointer-events:none}
.mcard label{position:absolute;top:6px;left:6px;background:#fffe;border-radius:6px;padding:2px 6px;z-index:1}
.mcard small{display:block;padding:4px 8px;background:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:16px 0}
.stats div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:center}.stats b{display:block;font-size:1.6rem}
.hours{display:flex;align-items:flex-end;gap:2px;height:70px}.hours i{flex:1;background:var(--p);min-height:2px;border-radius:2px 2px 0 0}
.lb{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:50}
.lb img{max-width:100%;max-height:100%}.lb button{position:absolute;background:#fff3;color:#fff;border:0;font-size:2rem;width:48px;height:48px;border-radius:50%;cursor:pointer}
.lb .x{top:max(12px,env(safe-area-inset-top));right:12px}.lb .l{left:8px}.lb .r{right:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
.confetti i{position:fixed;top:-10px;width:8px;height:12px;opacity:.9;animation:fall 2s ease-in forwards;z-index:70}
@keyframes fall{to{transform:translate(var(--x),100vh) rotate(540deg);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}

/* tema preto e dourado da área admin */
main{position:relative}
body.adm{--bg:#0b0907;--ink:#f1e6cf;--mut:#b9a98a;--p:#d9b56a;--line:#6b5326;font-family:"Cormorant Garamond",Georgia,serif;font-size:1.12rem;background:radial-gradient(ellipse at 88% 10%,#5a3f14aa,transparent 42%),radial-gradient(ellipse at 95% 55%,#4a3512aa,transparent 38%),radial-gradient(ellipse at 5% 95%,#2e220e99,transparent 50%),#0b0907}
.adm main{z-index:1}
.adm .topbar{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.adm .mono{font:500 2.4rem/1 "Cormorant Garamond",serif;display:flex;align-items:center;gap:8px}
.adm .mono i{width:1px;height:2.6rem;background:var(--p)}
.adm .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--p),transparent 95%)}
.adm .tag{letter-spacing:.3em;font-size:.8rem;color:var(--p);text-transform:uppercase}
.adm h1{font-size:clamp(2.8rem,12vw,4.4rem);margin:.1em 0 0}
.adm .script{font:400 clamp(2rem,8vw,3rem)/1 "Great Vibes",cursive;color:var(--p);margin:0 0 20px;display:flex;align-items:center;gap:10px}
.adm .script.big{margin:40px 0 8px;justify-content:center}
.adm .stats{grid-template-columns:repeat(3,1fr);gap:14px}
.adm .stats div{position:relative;background:linear-gradient(150deg,#ffffff1c,#ffffff06);border:1.5px solid #c9a24d99;border-radius:22px;padding:18px 8px 16px;backdrop-filter:blur(6px);box-shadow:inset 0 1px 0 #ffffff26,0 8px 24px #0008}
.adm .stats b{font:500 3rem/1 "Cormorant Garamond",serif}
.adm .stats svg{position:absolute;right:10px;bottom:10px;color:var(--p)}
.adm summary{display:flex;align-items:center;gap:12px;list-style:none;cursor:pointer;font-size:1.5rem;margin:20px 0}
.adm summary::-webkit-details-marker{display:none}
.adm summary::before{content:"";border-left:14px solid var(--p);border-top:8px solid transparent;border-bottom:8px solid transparent}
.adm summary::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--p),transparent)}
.adm .btn{display:inline-flex;align-items:center;gap:10px;font:600 1.15rem "Cormorant Garamond",serif;padding:12px 26px;background:linear-gradient(180deg,#f3d891,#c79a45);color:#1a1206;box-shadow:0 4px 18px #c79a4533}
.adm .btn.ghost,.adm .tabs button{background:transparent;color:var(--ink);border:1.5px solid #c9a24dcc;box-shadow:none}
.adm .tabs{display:flex;flex-wrap:wrap;gap:12px}
.adm .tabs button{margin:0;padding:12px 30px;font:600 1.15rem "Cormorant Garamond",serif;border-radius:999px}
.adm .tabs [aria-selected=true]{background:linear-gradient(180deg,#f3d891,#c79a45);color:#1a1206;border-color:transparent}
.adm .bar{display:block}.adm .bar>div+div{margin-top:14px;display:flex;flex-wrap:wrap;gap:12px}
.adm .mcard{border:1.5px solid #c9a24d;border-radius:22px;background:#17120b}
.adm .mcard small,.adm .mcard p{background:#17120b!important;color:var(--ink)}
.adm .card{background:#14100add;border-color:#6b5326}
.adm input[type=password]{background:#0d0a06;color:var(--ink);border-color:#6b5326}
.adm .deco{position:absolute;pointer-events:none;z-index:-1}
.adm .rings{top:150px;right:-6px;width:190px}
.adm .flowers{bottom:-10px;right:-10px;width:170px;opacity:.9}

/* ajuste de proporções do tema admin + foto de fundo opcional (fundo-admin.jpg) */
.adm main{overflow:hidden}
.adm .mono{font-size:2rem}.adm .mono i{height:2.2rem}
.adm .tag{font-size:.7rem;letter-spacing:.25em}
.adm h1{font-size:2.5rem;font-weight:500}
.adm .script{font-size:2.1rem}
.adm .rings{top:62px;right:28px;width:150px}
.adm .stats{gap:12px}.adm .stats div{padding:14px 6px 12px;border-radius:20px;font-size:.95rem}
.adm .stats b{font-size:2.1rem}
.adm .stats svg{width:22px;height:22px;right:8px;bottom:8px}
.adm summary{font-size:1.15rem}
.adm .btn,.adm .btn.sm{font-size:.95rem;padding:8px 18px;gap:8px}
.adm .btn svg{width:18px;height:18px}
.adm .tabs button{font-size:.95rem;padding:8px 22px}
.adm.foto::before{content:"";position:fixed;inset:0;background:url(fundo-admin.jpg) center top/cover no-repeat;z-index:-1}
.adm.foto .deco{display:none}
</style>
</head>
<body>
<main id="app" tabindex="-1"><p class="center muted">Carregando…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbzXSlsQAR4k4SPQZh1BEGkj8mRxtiykUvmfbe8C83GI7r2n6rlZ0QZWrLnGZNh3kosZ/exec' };

/* ---------- validação (client; o servidor revalida via RLS + bucket) ---------- */
const MB = 1048576, MAX_FILES = 20, MAX_PHOTO = 20 * MB, MAX_VIDEO = 200 * MB;
const PHOTO = ['image/jpeg', 'image/png', 'image/webp', 'image/heic', 'image/heif'], VIDEO = ['video/mp4', 'video/quicktime', 'video/webm'];
const EXT = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', heic: 'image/heic', heif: 'image/heif', mp4: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm' };
const MSG = { vazio: 'Arquivo vazio', tipo: 'Formato não suportado', foto_grande: 'Foto acima de 20 MB', video_grande: 'Vídeo acima de 200 MB', muitos: 'Escolha até 20 arquivos por vez', nenhum: 'Nenhum arquivo selecionado' };
const mimeOf = f => (f.type || EXT[(f.name || '').split('.').pop().toLowerCase()] || '').toLowerCase();
function validateFile(f) {
  if (!f.size) return { ok: false, reason: 'vazio' };
  const mime = mimeOf(f), kind = PHOTO.includes(mime) ? 'photo' : VIDEO.includes(mime) ? 'video' : null;
  if (!kind) return { ok: false, reason: 'tipo' };
  if (kind === 'photo' && f.size > MAX_PHOTO) return { ok: false, reason: 'foto_grande' };
  if (kind === 'video' && f.size > MAX_VIDEO) return { ok: false, reason: 'video_grande' };
  return { ok: true, kind, mime };
}
function validateBatch(fs) {
  if (!fs.length) return { ok: false, reason: 'nenhum' };
  if (fs.length > MAX_FILES) return { ok: false, reason: 'muitos' };
  return { ok: true };
}
window.AlbumValidate = { validateFile, validateBatch };

/* ---------- base ---------- */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const app = $('#app'), sleep = ms => new Promise(r => setTimeout(r, ms));
let event = null;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3500); }
function showError(m) { app.innerHTML = `<section class="card center" role="alert"><h1>Ops</h1><p>${esc(m)}</p><button class="btn" onclick="location.reload()">Tentar de novo</button></section>`; app.focus(); }
const guestName = () => localStorage.getItem('guestName') || 'Convidado';
const tokenNow = () => localStorage.getItem('albumToken') || '';
async function api(body) {
  for (let a = 0; ; a++) {
    try { return await (await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(body) })).json(); }
    catch (e) { if (a === 2) throw e; await sleep(800 * (a + 1)); }
  }
}
async function loadEvent() {
  if (event) return event;
  const r = await api({ a: 'event', token: tokenNow() });
  return (event = r.error ? null : r);
}
function needEntry() {
  const t = localStorage.getItem('albumToken');
  if (t) location.hash = '#/e/' + t; else showError('Link inválido ou expirado. Escaneie o QR code do evento.');
}
const fmtDate = d => d ? new Date(d + 'T00:00').toLocaleDateString('pt-BR', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
const dImg = id => `https://lh3.googleusercontent.com/d/${id}=w1600`, dThumb = id => `https://lh3.googleusercontent.com/d/${id}=w600`, dVideo = id => `https://drive.google.com/file/d/${id}/preview`;

/* ---------- entrada /e/TOKEN ---------- */
async function join(token, name) {
  localStorage.setItem('albumToken', token); event = null;
  if (!await loadEvent()) { localStorage.removeItem('albumToken'); return showError('Este link não é válido. Peça o QR code atualizado aos noivos.'); }
  localStorage.setItem('guestName', name); location.hash = '#/home';
}
async function viewEntry(token) {
  const saved = localStorage.getItem('guestName');
  if (saved) return join(token, saved);
  app.innerHTML = `<section class="card center"><h1>Bem-vindo(a)!</h1><p>Como podemos chamar você?</p><label for="name-input">Seu nome</label><input id="name-input" type="text" autocomplete="name" maxlength="80"><button id="enter-btn" class="btn">Entrar no álbum</button></section>`;
  const go = () => { const n = $('#name-input').value.trim(); if (!n) return toast('Digite seu nome para continuar.'); join(token, n); };
  $('#enter-btn').onclick = go; $('#name-input').onkeydown = e => e.key === 'Enter' && go(); $('#name-input').focus();
}

/* ---------- home + upload ---------- */
async function compress(f) {
  if (!f.type.startsWith('image/') || f.type === 'image/gif') return f;
  try {
    const b = await createImageBitmap(f, { imageOrientation: 'from-image' });
    const k = Math.min(1, 2048 / Math.max(b.width, b.height)), w = Math.round(b.width * k), h = Math.round(b.height * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(b, 0, 0, w, h); b.close();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', .8));
    if (!blob || (k === 1 && blob.size >= f.size)) return f;
    return new File([blob], f.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch { return f; }
}
async function uploadOne(f, v, onP) {
  const body = v.kind === 'photo' ? await compress(f) : f, CH = 3 * MB; // 3 MB = múltiplo de 256 KB, exigido pelo Drive
  const init = await api({ a: 'init', token: tokenNow(), guest: guestName(), filename: body.name, mime: body.type || v.mime, size: body.size });
  if (!init.uploadId) throw new Error(init.error || 'init');
  for (let off = 0; off < body.size; off += CH) {
    const buf = new Uint8Array(await body.slice(off, off + CH).arrayBuffer());
    let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    const r = await api({ a: 'chunk', token: tokenNow(), uploadId: init.uploadId, offset: off, data: btoa(bin) });
    if (r.error) throw new Error(r.error);
    onP(Math.min(100, Math.round((off + CH) / body.size * 100)));
  }
}
function confetti() {
  const c = document.createElement('div'); c.className = 'confetti'; c.setAttribute('aria-hidden', 'true');
  for (let i = 0; i < 28; i++) { const s = document.createElement('i'); s.style.cssText = `left:${Math.random() * 100}%;background:${['var(--p)', 'var(--s)', '#e8d9b5'][i % 3]};animation-delay:${Math.random() * .4}s;--x:${(Math.random() - .5) * 120}px`; c.append(s); }
  document.body.append(c); setTimeout(() => c.remove(), 2600);
}
async function handleFiles(files) {
  files = [...files];
  const b = validateBatch(files); if (!b.ok) return toast(MSG[b.reason]);
  const q = $('#queue'); let ok = 0, i = 0;
  const jobs = files.map(f => { const li = document.createElement('li'); li.innerHTML = `<span>${esc(f.name)}</span><progress max="100" value="0" aria-label="Progresso de ${esc(f.name)}"></progress><em>Na fila</em>`; q.append(li); return { f, li }; });
  const worker = async () => {
    while (i < jobs.length) {
      const { f, li } = jobs[i++], st = $('em', li), pr = $('progress', li), v = validateFile(f);
      if (!v.ok) { st.textContent = MSG[v.reason]; li.classList.add('err'); continue; }
      st.textContent = 'Enviando…';
      try { await uploadOne(f, v, p => pr.value = p); pr.value = 100; st.textContent = 'Enviado ✓'; ok++; }
      catch { st.textContent = 'Falhou. Escolha o arquivo de novo para reenviar.'; li.classList.add('err'); }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  if (ok) { confetti(); toast(`${ok} enviado${ok > 1 ? 's' : ''}. Obrigado!`); const c = $('#count'); if (c) c.textContent = +c.textContent + ok; localStorage.setItem('myCount', (+localStorage.getItem('myCount') || 0) + ok); }
}
async function viewHome() {
  if (!await loadEvent()) return needEntry();
  app.innerHTML = `<header class="hero"><h1>${esc(event.couple_names)}</h1><p>${esc(fmtDate(event.event_date))}</p><p>${esc(event.venue || '')}</p><p>Compartilhe com a gente os melhores momentos da festa.</p></header>
<input id="file-input" class="vh" type="file" accept="image/*,video/*" multiple><label class="btn big" for="file-input">Enviar foto ou vídeo</label>
<input id="cam-input" class="vh" type="file" accept="image/*,video/*" capture="environment"><label class="btn ghost" for="cam-input" style="display:block">Abrir a câmera agora</label>
<ul id="queue" aria-live="polite"></ul>
<section class="card" style="margin:24px auto"><h2>Deixe uma mensagem carinhosa</h2><label for="msg-input">Sua mensagem para os noivos</label><textarea id="msg-input" maxlength="500" rows="3" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit;margin:6px 0 12px"></textarea><button id="msg-btn" class="btn">Enviar mensagem</button></section>
<p class="center muted">Você enviou <strong id="count">${+localStorage.getItem('myCount') || 0}</strong> fotos e vídeos até agora. <a href="#/mural">Ver o mural</a></p>`;
  for (const id of ['#file-input', '#cam-input']) $(id).onchange = e => { handleFiles(e.target.files); e.target.value = ''; };
  $('#msg-btn').onclick = async () => {
    const t = $('#msg-input').value.trim(); if (!t) return toast('Escreva sua mensagem primeiro.');
    const r = await api({ a: 'message', token: tokenNow(), guest: guestName(), text: t });
    if (r.error) return toast('Não foi possível enviar. Tente de novo.');
    $('#msg-input').value = ''; confetti(); toast('Mensagem enviada. Obrigado!');
  };
}

/* ---------- mural ---------- */
function lightbox(list, i) {
  const prev = document.activeElement, o = document.createElement('div');
  o.className = 'lb'; o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true'); o.setAttribute('aria-label', 'Foto ampliada');
  o.innerHTML = '<button class="x" aria-label="Fechar">✕</button><button class="l" aria-label="Foto anterior">‹</button><img alt=""><p class="cap" style="position:absolute;bottom:16px;left:0;right:0;text-align:center;color:#fff;margin:0"></p><button class="r" aria-label="Próxima foto">›</button>';
  const img = $('img', o), go = d => { i = (i + d + list.length) % list.length; img.src = list[i].u; $('.cap', o).textContent = 'Enviada por ' + list[i].n; };
  const key = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); };
  const close = () => { o.remove(); removeEventListener('keydown', key); prev && prev.focus(); };
  let x0 = 0;
  o.addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
  o.addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1); });
  $('.x', o).onclick = close; $('.l', o).onclick = () => go(-1); $('.r', o).onclick = () => go(1);
  addEventListener('keydown', key); document.body.append(o); go(0); $('.x', o).focus();
}
async function viewMural() {
  if (!await loadEvent()) return needEntry();
  app.innerHTML = `<nav class="bar"><a href="#/home">Enviar mais</a><div class="tabs" role="tablist" aria-label="Filtrar mural">${[['all', 'Todas'], ['photo', 'Fotos'], ['video', 'Vídeos'], ['msg', 'Mensagens']].map(([k, l]) => `<button role="tab" data-f="${k}" aria-selected="${k === 'all'}">${l}</button>`).join('')}</div></nav>
<div id="grid" class="masonry" aria-busy="true"><p class="muted">Carregando…</p></div><p id="empty" class="muted center" hidden>Ainda não há nada por aqui. Volte em breve!</p>`;
  const r = await api({ a: 'list', token: tokenNow() });
  if (r.error) return showError('Não foi possível carregar o mural. Tente de novo.');
  let filter = 'all'; const photos = r.media.filter(i => i.kind === 'photo');
  const draw = () => {
    const med = filter === 'msg' ? [] : r.media.filter(i => filter === 'all' || i.kind === filter), msgs = filter === 'all' || filter === 'msg' ? r.messages : [];
    $('#grid').innerHTML = med.map(i => i.kind === 'photo'
      ? `<figure><div class="ph" data-wm="${esc(event.initials)}"><img loading="lazy" src="${dThumb(i.id)}" alt="Foto de ${esc(i.guest)}" data-id="${i.id}"></div><figcaption>Enviada por ${esc(i.guest)}</figcaption></figure>`
      : `<figure><iframe src="${dVideo(i.id)}" loading="lazy" allow="autoplay" allowfullscreen title="Vídeo de ${esc(i.guest)}" style="width:100%;aspect-ratio:3/4;border:0"></iframe><figcaption>Enviado por ${esc(i.guest)}</figcaption></figure>`).join('')
      + msgs.map(m => `<figure><p style="margin:0;padding:14px;background:#fff;font:1.15rem/1.35 'Cormorant Garamond',Georgia,serif">“${esc(m.text)}”</p><figcaption>${esc(m.guest)}</figcaption></figure>`).join('');
    $('#empty').hidden = med.length + msgs.length > 0; $('#grid').setAttribute('aria-busy', 'false');
    $$('#grid img').forEach(im => im.onclick = () => lightbox(photos.map(p => ({ u: dImg(p.id), n: p.guest })), photos.findIndex(p => p.id === im.dataset.id)));
  };
  $$('.tabs button').forEach(b => b.onclick = () => { filter = b.dataset.f; $$('.tabs button').forEach(x => x.setAttribute('aria-selected', x === b)); draw(); });
  draw();
}

/* ---------- admin ---------- */
const ICONS = {
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  ok: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.5"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/>',
  cloud: '<path d="M7 18a4 4 0 010-8 5.5 5.5 0 0110.6 1.5A3.5 3.5 0 0117 18"/><path d="M12 12v7M9 14.5l3-3 3 3"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  star: '<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z"/>',
  trash: '<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/>'
};
const ic = (k, s = 22) => `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[k]}</svg>`;
const HEART = '<svg viewBox="0 0 28 24" width="34" height="30" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M14 22C6 16 3 11 3 8a5 5 0 0111-1 5 5 0 0111 1c0 3-3 8-11 14z"/></svg>';
const HEARTS = '<svg viewBox="0 0 60 30" width="90" height="45" fill="none" stroke="#d9b56a" stroke-width="1.6" aria-hidden="true"><path d="M20 27C12 21 9 16 9 13a5 5 0 0111-1 5 5 0 0111 1c0 3-3 8-11 14z"/><path d="M38 27C30 21 27 16 27 13a5 5 0 0111-1 5 5 0 0111 1c0 3-3 8-11 14z"/></svg>';
const RINGS = '<svg class="deco rings" viewBox="0 0 200 110" aria-hidden="true"><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc9a"/><stop offset=".5" stop-color="#c9983e"/><stop offset="1" stop-color="#8a6322"/></linearGradient></defs><g fill="none" stroke="url(#gold)" stroke-width="9"><ellipse cx="68" cy="62" rx="52" ry="30" transform="rotate(-8 68 62)"/><ellipse cx="128" cy="48" rx="52" ry="30" transform="rotate(-8 128 48)"/></g></svg>';
const flowers = () => `<svg class="deco flowers" viewBox="0 0 170 240" aria-hidden="true"><g stroke="#8b7a56" stroke-width="1.4" fill="none"><path d="M160 240C130 170 110 110 70 25"/><path d="M165 240C150 180 150 120 120 40"/><path d="M155 240C110 200 70 160 25 120"/></g>${Array.from({ length: 46 }, (_, k) => { const t = k / 46, b = k % 3; return `<circle cx="${(160 - t * 120 - b * 14 + Math.sin(k * 1.7) * 11).toFixed(1)}" cy="${(235 - t * 210 + Math.cos(k * 2.3) * 9).toFixed(1)}" r="${3 + k % 4}" fill="#f3ead7" opacity=".85"/>`; }).join('')}</svg>`;
let AF = 'pending';
async function viewAdmin() {
  const pass = sessionStorage.getItem('adm') || '';
  const r = pass ? await api({ a: 'adminList', pass }) : { error: 'senha' };
  if (r.error) {
    sessionStorage.removeItem('adm');
    app.innerHTML = `<section class="card"><h1>Área dos noivos</h1><label for="admin-pass">Senha</label><input id="admin-pass" type="password" autocomplete="current-password"><button id="admin-login" class="btn">Entrar</button></section>`;
    $('#admin-login').onclick = async () => { const p = $('#admin-pass').value, x = await api({ a: 'adminList', pass: p }); if (x.error) return toast('Senha incorreta.'); sessionStorage.setItem('adm', p); viewAdmin(); };
    return;
  }
  const ev = await api({ a: 'event', pass }), media = r.media, msgs = r.messages, by = s => media.filter(x => x.status === s).length, guests = {};
  media.forEach(m => guests[m.guest] = (guests[m.guest] || 0) + 1);
  const link = location.origin + location.pathname + '#/e/' + ev.token;
  const card = x => `<div class="mcard"><label><input type="checkbox" class="sel" value="${esc(x.id)}" aria-label="Selecionar item de ${esc(x.guest)}"></label>${x.kind === 'photo' ? `<img src="${dThumb(x.id)}" alt="Foto de ${esc(x.guest)}" loading="lazy">` : `<iframe src="${dVideo(x.id)}" loading="lazy" title="Vídeo de ${esc(x.guest)}" style="width:100%;aspect-ratio:3/4;border:0"></iframe>`}<small>${x.favorite === true ? 'Favorita: ' : ''}${esc(x.guest)}</small></div>`;
  const msgCard = m => `<div class="mcard"><label><input type="checkbox" class="sel" value="${esc(m.id)}" aria-label="Selecionar mensagem de ${esc(m.guest)}"></label><p style="padding:36px 12px 8px;margin:0;background:#fff">${esc(m.text)}</p><small>${esc(m.guest)} (${m.status === 'approved' ? 'visível' : 'oculta'})</small></div>`;
  app.innerHTML = `${RINGS}${flowers()}<div class="topbar"><span class="mono">${esc((ev.initials || 'G&D').split('&')[0])}<i></i>${esc((ev.initials || 'G&D').split('&')[1] || '')}</span><span class="rule"></span><span class="tag">Nosso álbum</span></div><h1>Moderação</h1><p class="script">do nosso álbum ${HEART}</p>
<div class="stats"><div><b>${media.length}</b>Total${ic('image', 34)}</div><div><b>${by('pending')}</b>Pendentes${ic('clock', 34)}</div><div><b>${by('approved')}</b>Aprovadas${ic('ok', 34)}</div><div><b>${msgs.length}</b>Mensagens${ic('chat', 34)}</div></div>
<details><summary>Envios por convidado</summary><p>${Object.entries(guests).sort((a, b) => b[1] - a[1]).map(([n, c]) => `${esc(n)}: ${c}`).join('; ') || 'Nenhum envio ainda.'}</p></details>
<p><a class="btn sm ghost" href="${esc(ev.folder)}" target="_blank" rel="noopener">${ic('cloud', 26)}Abrir a pasta no Drive</a></p>
<div class="bar" style="margin-top:16px"><div class="tabs" role="tablist" aria-label="Filtro">${[['pending', 'Pendentes'], ['approved', 'Aprovadas'], ['rejected', 'Reprovadas'], ['msg', 'Mensagens']].map(([k, l]) => `<button role="tab" data-f="${k}" aria-selected="${k === AF}">${l}</button>`).join('')}</div>
<div><button class="btn sm ghost" id="all">${ic('check')}Marcar todas</button> <button class="btn sm" data-a="approve">${ic('check')}Aprovar</button> <button class="btn sm ghost" data-a="reject">${ic('x')}Reprovar</button> <button class="btn sm ghost" data-a="fav">${ic('star')}Favoritar</button> <button class="btn sm ghost" data-a="delete">${ic('trash')}Excluir</button></div></div>
<div class="masonry">${(AF === 'msg' ? msgs.map(msgCard) : media.filter(x => x.status === AF).map(card)).join('') || '<p class="muted">Nada por aqui.</p>'}</div>
<section class="center" style="margin-top:32px"><h2>QR code do evento</h2><div id="qr" style="display:inline-block;padding:12px;background:#fff"></div><p class="muted" style="word-break:break-all;font-size:.85rem">${esc(link)}</p><p><a id="qr-dl" class="btn sm" download="qr-casamento.png" href="#/admin">Baixar PNG</a></p></section><p class="script big">Nosso grande dia</p><p class="center">${HEARTS}</p>`;
  $$('.tabs button').forEach(b => b.onclick = () => { AF = b.dataset.f; viewAdmin(); });
  $('#all').onclick = () => { const on = $$('.sel').some(x => !x.checked); $$('.sel').forEach(x => x.checked = on); };
  $$('[data-a]').forEach(b => b.onclick = async () => {
    const ids = $$('.sel:checked').map(x => x.value), a = b.dataset.a;
    if (!ids.length) return toast('Selecione ao menos um item.');
    if (a === 'delete' && !confirm(`Excluir ${ids.length} item(ns) para sempre?`)) return;
    const x = await api({ a: 'adminAct', pass, act: a, ids, kind: AF === 'msg' ? 'msg' : 'media' });
    if (x.error) return toast('Não foi possível concluir a ação.');
    viewAdmin();
  });
  new QRCode($('#qr'), { text: link, width: 256, height: 256, correctLevel: QRCode.CorrectLevel.H });
  $('#qr-dl').onclick = e => { e.currentTarget.href = $('#qr canvas').toDataURL('image/png'); };
}

/* ---------- rotas e PWA ---------- */
async function route() {
  const h = location.hash.replace(/^#\/?/, '').split('/');
  document.body.classList.toggle('adm', h[0] === 'admin');
  if (h[0] === 'admin' && !document.body.classList.contains('foto')) { const im = new Image(); im.onload = () => document.body.classList.add('foto'); im.src = 'fundo-admin.jpg'; }
  try {
    if (h[0] === 'e' && h[1]) await viewEntry(decodeURIComponent(h[1]));
    else if (h[0] === 'home') await viewHome();
    else if (h[0] === 'mural') await viewMural();
    else if (h[0] === 'admin') await viewAdmin();
    else needEntry();
  } catch (e) { console.error(e); showError('Algo deu errado (' + ((e && e.message) || 'sem detalhe') + '). Verifique a conexão e tente de novo.'); }
}
addEventListener('hashchange', route); route();
(() => {
  const m = { name: 'Álbum do Casamento', short_name: 'Álbum', start_url: location.href.split('#')[0] + '#/home', display: 'standalone', background_color: '#faf7f2', theme_color: '#faf7f2', icons: [{ src: 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#4f6b52"/><text x="50" y="68" font-size="54" text-anchor="middle" fill="#fff">♥</text></svg>'), sizes: 'any', type: 'image/svg+xml' }] };
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' })); document.head.append(l);
})();
</script>
</body>
